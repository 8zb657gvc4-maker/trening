<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- IKONA APLIKACJI (118) — paleta „Nocny granat" (114). Źródło dla
       ikona-180.png (apple-touch-icon, iPhone), ikona-192.png i ikona-512.png
       (manifest). PNG renderuje narzedzia/ikony.js — po zmianie tego pliku
       puść go jeszcze raz. Tło na cały kwadrat: narożniki zaokrągla iOS. -->
  <defs>
    <radialGradient id="tlo" cx="50%" cy="34%" r="75%">
      <stop offset="0" stop-color="#1f2d57"/>
      <stop offset="0.55" stop-color="#0d1530"/>
      <stop offset="1" stop-color="#070b18"/>
    </radialGradient>
    <radialGradient id="blask" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c9cff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#7c9cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="talerz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9bcff"/>
      <stop offset="1" stop-color="#6a8bf5"/>
    </linearGradient>
    <linearGradient id="talerz2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f9cf2"/>
      <stop offset="1" stop-color="#4d6be0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#tlo)"/>
  <circle cx="512" cy="512" r="360" fill="url(#blask)"/>
  <!-- pierścień postępu jak w aplikacji: ślad i miętowy łuk na 3/4 obwodu.
       Pierwsza wersja miała sam łuk pod sztangą — razem z talerzami czytał
       się jak uśmiechnięta buźka. -->
  <circle cx="512" cy="512" r="400" fill="none" stroke="#18233f" stroke-width="30"/>
  <circle cx="512" cy="512" r="400" fill="none" stroke="#5ef2c7" stroke-width="30" stroke-linecap="round"
    stroke-dasharray="1885 2513" transform="rotate(-90 512 512)"/>
  <!-- gryf -->
  <rect x="170" y="482" width="684" height="44" rx="22" fill="#c9d6ff"/>
  <!-- talerze: duże wewnątrz, mniejsze na zewnątrz -->
  <rect x="290" y="300" width="84" height="408" rx="28" fill="url(#talerz)"/>
  <rect x="650" y="300" width="84" height="408" rx="28" fill="url(#talerz)"/>
  <rect x="216" y="370" width="62" height="268" rx="22" fill="url(#talerz2)"/>
  <rect x="746" y="370" width="62" height="268" rx="22" fill="url(#talerz2)"/>
  <!-- zaciski -->
  <rect x="384" y="466" width="22" height="76" rx="8" fill="#e8eeff"/>
  <rect x="618" y="466" width="22" height="76" rx="8" fill="#e8eeff"/>
</svg>
